name: release
on:
  push:
    branches:
      - main
  # Manual retry for failed publishes: `lerna publish from-package` is idempotent,
  # so it only publishes versions missing from the registry.
  workflow_dispatch: {}

permissions: {}

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.TOKENS_APP_ID }}
          private-key: ${{ secrets.TOKENS_PRIVATE_KEY }}
          # downscope from the app's full installation permissions to what release-please needs
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if:
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created ==
      'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Build workspaces
        run: npm run build
      - name: Publish packages
        run: npx lerna publish from-package --yes --no-private
        env:
          NPM_CONFIG_PROVENANCE: true
